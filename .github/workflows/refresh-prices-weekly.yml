name: Weekly price refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC — всегда пересчитывает всё
  workflow_dispatch:
    inputs:
      sheetId:
        description: 'ID листа для пересчёта (пусто/all — все листы)'
        required: false
        default: 'all'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Install Chromium
        working-directory: scripts
        run: npx playwright install --with-deps chromium
      - name: Refresh prices
        working-directory: scripts
        run: |
          set -x
          echo "DEBUG: node version:"
          node --version
          echo "DEBUG: files in this directory:"
          ls -la
          echo "DEBUG: sheetId input = [${{ github.event.inputs.sheetId }}]"
          if [ -n "${{ github.event.inputs.sheetId }}" ] && [ "${{ github.event.inputs.sheetId }}" != "all" ]; then
            node check-prices.mjs --sheet "${{ github.event.inputs.sheetId }}"
          else
            node check-prices.mjs --all
          fi
          echo "DEBUG: node exit code was $?"
